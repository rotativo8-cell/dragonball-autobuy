services:
  monitor:
    build: .
    init: true
    env_file: .env
    environment:
      MONITOR_ONLY: "true"
      MONITOR_LOG_DIR: /app/logs
      DATA_DIR: /app/data
      SCREENSHOT_DIR: /app/screenshots
    volumes:
      - ${MONITOR_LOG_HOST_DIR:-/home/cristian/.local/state/dragonball-monitor}:/app/logs
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    shm_size: 1gb
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
