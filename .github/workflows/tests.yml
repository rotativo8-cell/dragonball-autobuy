name: Python tests
on:
  push:
    branches: [work, codex/jumpichiban-backoff, codex/server-check-alerts]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: bash -n ops/install_server_check.sh
      - run: python -m unittest discover -s tests -v
      - name: Build non-root monitor image
        run: docker build -t monitor-ci .
      - name: Test image offline without production state or secrets
        run: docker run --rm --network none --entrypoint python --mount type=bind,source="${{ github.workspace }}/tests/container_smoke.py",target=/tmp/container_smoke.py,readonly monitor-ci /tmp/container_smoke.py
