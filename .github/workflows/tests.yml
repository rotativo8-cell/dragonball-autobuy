name: Python tests
on:
  push:
    branches: [work, codex/jumpichiban-backoff, codex/server-check-alerts]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: bash -n ops/install_server_check.sh
      - run: python -m unittest discover -s tests -v
